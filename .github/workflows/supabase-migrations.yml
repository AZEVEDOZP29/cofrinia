name: Configurar Supabase

on:
  push:
    branches: [SAAS-FINANCE]
    paths:
      - supabase/config.toml
      - supabase/migrations/**
      - .github/workflows/supabase-migrations.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: supabase-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Aplicar banco e autenticação
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      CONFIGURED_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_REF || secrets.SUPABASE_PROJECT_ID }}
      PUBLIC_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL || vars.SUPABASE_URL || secrets.SUPABASE_URL }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Validar credenciais
        id: config
        shell: bash
        run: |
          set -euo pipefail

          project_ref="${CONFIGURED_PROJECT_REF}"
          if [[ -z "${project_ref}" && "${PUBLIC_SUPABASE_URL}" =~ ^https://([a-z0-9-]+)\.supabase\.co/?$ ]]; then
            project_ref="${BASH_REMATCH[1]}"
          fi

          if [[ -n "${project_ref}" && ! "${project_ref}" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::SUPABASE_PROJECT_REF contém um formato inválido."
            exit 1
          fi

          missing=()
          [[ -n "${SUPABASE_ACCESS_TOKEN}" ]] || missing+=("SUPABASE_ACCESS_TOKEN")
          [[ -n "${SUPABASE_DB_URL}" ]] || missing+=("SUPABASE_DB_URL")
          [[ -n "${project_ref}" ]] || missing+=("SUPABASE_PROJECT_REF ou SUPABASE_PROJECT_ID")
          if (( ${#missing[@]} )); then
            printf '::error::Cadastre no GitHub: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

          if [[ "${SUPABASE_DB_URL}" == *$'\n'* || "${SUPABASE_DB_URL}" == *$'\r'* ]]; then
            echo "::error::SUPABASE_DB_URL contém um valor inválido."
            exit 1
          fi

          case "${SUPABASE_DB_URL}" in
            postgres://*|postgresql://*) ;;
            *)
              echo "::error::SUPABASE_DB_URL deve ser uma URI PostgreSQL."
              exit 1
              ;;
          esac

          authority="${SUPABASE_DB_URL#*://}"
          authority="${authority%%/*}"
          if [[ "${authority}" != *@* ]]; then
            echo "::error::SUPABASE_DB_URL não contém as credenciais do banco."
            exit 1
          fi

          credentials="${authority%@*}"
          db_password="${credentials#*:}"
          if [[ "${credentials}" == "${db_password}" || -z "${db_password}" ]]; then
            echo "::error::SUPABASE_DB_URL não contém a senha do banco."
            exit 1
          fi
          echo "::add-mask::${db_password}"
          unset db_password credentials

          host_port="${authority##*@}"
          if [[ "${host_port}" == *:6543 ]]; then
            echo "::error::Use o Shared Session Pooler na porta 5432; a porta 6543 não é aceita para migrações."
            exit 1
          fi
          if [[ "${host_port}" != *:5432 ]]; then
            echo "::error::SUPABASE_DB_URL deve usar a porta 5432 do Shared Session Pooler."
            exit 1
          fi

          pooler_host="${host_port%:5432}"
          if [[ ! "${pooler_host}" =~ ^([a-z0-9-]+\.)+pooler\.supabase\.com$ ]]; then
            echo "::error::SUPABASE_DB_URL deve apontar para o Shared Session Pooler do Supabase."
            exit 1
          fi
          if [[ "${SUPABASE_DB_URL}" == *'[YOUR-PASSWORD]'* ]]; then
            echo "::error::Substitua o marcador de senha na SUPABASE_DB_URL."
            exit 1
          fi

          [[ -f supabase/config.toml ]] || {
            echo "::error::O arquivo supabase/config.toml não foi encontrado."
            exit 1
          }

          printf 'SUPABASE_PROJECT_REF=%s\n' "${project_ref}" >> "${GITHUB_ENV}"

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validar migrações
        shell: bash
        run: supabase db push --db-url "${SUPABASE_DB_URL}" --include-all --dry-run

      - name: Aplicar migrações
        shell: bash
        run: supabase db push --db-url "${SUPABASE_DB_URL}" --include-all --yes

      - name: Configurar URLs de autenticação
        shell: bash
        run: |
          set -euo pipefail

          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          http_status="$(curl --silent --show-error \
            --output "${response_file}" \
            --write-out '%{http_code}' \
            --request PATCH \
            --header "Authorization: Bearer ${SUPABASE_ACCESS_TOKEN}" \
            --header 'Content-Type: application/json' \
            --data '{"site_url":"https://azevedozp29.github.io/cofrinia/","uri_allow_list":"https://azevedozp29.github.io/cofrinia/**,http://localhost:5173/**,http://127.0.0.1:5173/**"}' \
            "https://api.supabase.com/v1/projects/${SUPABASE_PROJECT_REF}/config/auth")"

          if [[ ! "${http_status}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Não foi possível configurar as URLs de autenticação (HTTP ${http_status})."
            exit 1
          fi

          echo "URLs de autenticação configuradas."

      - name: Publicar frontend configurado
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME}"
